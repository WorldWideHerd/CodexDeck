name: Prepare notarized macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Check source and version tag
        run: |
          npm run version:check -- "$RELEASE_TAG"
          npm run test:release
          npm test
          npm run format:check
          npm run build
          cargo test --locked --manifest-path src-tauri/Cargo.toml
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash scripts/test-desktop-quit.sh
      - name: Require release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import os
          keys = ('APPLE_CERTIFICATE', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_SIGNING_IDENTITY',
                  'APPLE_ID', 'APPLE_PASSWORD', 'APPLE_TEAM_ID')
          missing = [key for key in keys if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Configure these repository secrets first: ' + ', '.join(missing))
          PY
      - uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Build with Developer ID
        env:
          CODEXDECK_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: npm run build:mac -- --skip-registration
      - name: Notarize, staple, validate and archive
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run package:mac -- --channel release
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: output/releases/*
          if-no-files-found: error
          retention-days: 30

  draft:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify archive checksums
        working-directory: release-assets
        run: sha256sum --check *.sha256
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import json, sys
          if not json.load(open(sys.argv[1]))['isDraft']:
              raise SystemExit('Refusing to replace assets of an already published release.')
          PY
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --draft --verify-tag \
              --title "CodexDeck $RELEASE_TAG" --notes-file CHANGELOG.md
          fi
