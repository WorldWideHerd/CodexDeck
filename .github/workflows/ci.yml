name: Cross-platform desktop checks

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config patchelf
      - name: Install frontend dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Release version checks
        run: |
          npm run version:check
          npm run test:release
      - name: Frontend formatting
        run: npm run format:check
      - name: Build frontend
        run: npm run build
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Test GLib backport under optimization
        if: runner.os == 'Linux'
        run: cargo test --release --locked --manifest-path scripts/tests/glib-variant-probe/Cargo.toml
      - name: macOS build-tool tests
        if: runner.os == 'macOS'
        run: |
          python3 -m unittest discover -s scripts/tests -p 'test_*.py'
          bash scripts/test-desktop-quit.sh
      - name: Build complete signed macOS app
        if: runner.os == 'macOS'
        run: npm run build:mac -- --skip-registration
      - name: Verify authenticated macOS broker
        if: runner.os == 'macOS'
        run: python3 scripts/verify-credential-broker.py --identifier com.codexdeck.desktop
      - name: Package macOS preview
        if: runner.os == 'macOS'
        run: npm run package:mac
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri -- build --bundles nsis
      - name: Build Linux package
        if: runner.os == 'Linux'
        run: npm run tauri -- build --bundles deb
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-preview-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/releases/*
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb

  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run licenses:check
